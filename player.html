<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Buzzer | اللاعب</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="guide.css" />
  
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-9YDCYGNY4F"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-9YDCYGNY4F");
    </script>
  </head>
  <body>
    <div class="container player-page-container">
      <div class="card player-join-card" id="joinView">
        <div class="card-header player-join-header">
          <h2 class="card-title">الانضمام إلى الجلسة</h2>
          <p class="card-desc">اختر اسمك وفريقك ثم اضغط انضمام</p>
        </div>

        <div class="card-content player-join-content">
          <div class="join-session-code-box">
            <div class="connected-label">كود الجلسة</div>
            <div class="connected-code join-session-code" id="deviceSessionCode">
              ------
            </div>
          </div>

          <div class="device-form player-join-form">
            <div class="field">
              <label for="deviceName">اسم اللاعب</label>
              <input
                class="input"
                id="deviceName"
                value="لاعب 1"
                maxlength="40"
                placeholder="اكتب اسمك"
              />
            </div>

            <div class="field">
              <label for="selectedTeam">اختر الفريق</label>
              <select class="select" id="selectedTeam"></select>
            </div>
          </div>

          <button class="btn join-player-btn" id="joinPlayerBtn" type="button">
            انضمام
          </button>
        </div>
      </div>

      <div class="card player-buzzer-card hidden" id="buzzerView">
        <div class="card-header player-buzzer-header">
          <div class="player-buzzer-top">
            <div>
              <h2 class="card-title">زر اللاعب</h2>
              <p class="card-desc">اضغط عند فتح الأزرار</p>
            </div>
            <span class="state-badge green" id="connectionBadge">متصل</span>
            <button class="help-fab help-fab--inline" data-gm-trigger type="button" aria-label="فتح دليل الاستخدام">
              <span class="help-fab__text">كيف يعمل</span>
              <span class="help-fab__icon">؟</span>
            </button>
          </div>
        </div>

        <div class="card-content player-buzzer-content">
          <div class="player-main-layout">
            <div class="player-answer-time-box player-answer-large">
              <div class="player-answer-label">وقت الإجابة</div>
              <div class="player-answer-value">
                <span id="answerTimeBig">3</span>
                <span class="answer-time-unit"></span>
              </div>
            </div>

            <div class="player-side-stats">
              <div class="stat-box player-stat-box player-cooldown-box">
                <div class="stat-label">وقت المنع</div>
                <div class="stat-value">
                  <span id="cooldownTimeLeft">0</span>
                </div>
              </div>

              <div class="player-small-stats-row">
                <div class="stat-box player-stat-box player-compact-stat">
                  <div class="stat-label">الفريق</div>
                  <div class="stat-value" id="deviceTeamName">-</div>
                </div>

                <div
                  class="stat-box player-stat-box player-compact-stat player-points-box"
                >
                  <div class="stat-label">نقاط الفريق</div>
                  <div class="stat-value" id="deviceTeamPoints">0</div>
                </div>
              </div>
            </div>
          </div>

          <div class="player-buzz-wrap">
            <button
              class="big-buzz player-main-buzz"
              id="deviceBuzzBtn"
              type="button"
              autocomplete="off"
            >
              اضغط
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="gm-overlay" id="gmOverlay" role="dialog" aria-modal="true"
         aria-labelledby="gmTitle" aria-hidden="true">
      <div class="gm-modal">
        <header class="gm-header">
          <div class="gm-header__title-wrap">
            <span class="gm-header__icon" aria-hidden="true">؟</span>
            <div class="gm-header__text">
              <h2 id="gmTitle">دليل استخدام الموقع</h2>
              <p>شرح مختصر لكل زر في كل شاشة</p>
            </div>
          </div>
          <button class="gm-header__close" data-gm-close type="button" aria-label="إغلاق">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </header>
        <nav class="gm-tabs" role="tablist" aria-label="شاشات الموقع"></nav>
        <div class="gm-body"></div>
        <footer class="gm-footer">
          <div class="gm-footer__left">
            <button class="gm-btn gm-btn--primary" data-gm-next type="button">التالي</button>
            <button class="gm-btn" data-gm-prev type="button" disabled>السابق</button>
            <label class="gm-checkbox">
              <input type="checkbox" id="gmDontShow" />
              <span>لا تُظهر الدليل تلقائياً مرة أخرى</span>
            </label>
          </div>
          <div class="gm-footer__right">
            <span class="gm-dots" aria-hidden="true"></span>
          </div>
        </footer>
      </div>
    </div>

    <script src="guide.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
